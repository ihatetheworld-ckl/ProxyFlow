<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ProxyFlow promotional artwork</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 440px;
        height: 280px;
        overflow: hidden;
        background: #1256db;
        color: white;
        font-family: Arial, sans-serif;
      }
      main {
        height: 100%;
        padding: 32px;
        background: radial-gradient(
          ellipse at 90% 90%,
          #518cff,
          transparent 70%
        );
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.8px;
      }
      .route {
        display: block;
        margin: 24px auto 0;
        width: 280px;
        height: 132px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <svg
          width="29"
          height="29"
          viewBox="0 0 32 32"
          fill="none"
          aria-hidden="true"
        >
          <path d="M16 9v9M7 23v-5h18v5" stroke="white" stroke-width="2.5" />
          <rect x="11" y="2" width="10" height="8" rx="2" fill="white" />
          <rect x="2" y="23" width="10" height="7" rx="2" fill="white" />
          <rect x="20" y="23" width="10" height="7" rx="2" fill="white" />
        </svg>
        ProxyFlow
      </div>
      <svg
        class="route"
        viewBox="0 0 280 132"
        fill="none"
        aria-label="Abstract routing paths"
      >
        <path
          d="M30 66h55q25 0 25-25v-3q0-20 25-20h95M85 66h145M85 66q25 0 25 25v3q0 20 25 20h95"
          stroke="#b5d5ff"
          stroke-width="3"
        />
        <rect x="3" y="42" width="53" height="48" rx="14" fill="white" />
        <path
          d="m22 55 15 11-15 11"
          stroke="#1256db"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="238" cy="18" r="12" fill="white" />
        <circle cx="238" cy="66" r="12" fill="#c6e8ff" />
        <circle cx="238" cy="114" r="12" fill="white" />
      </svg>
    </main>
  </body>
</html>
