name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version and notes
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          tag = os.environ['GITHUB_REF_NAME']
          assert tag == 'v' + version, 'Tag must match package version'
          assert Path('docs/releases', tag + '.md').is_file(), 'Release notes are required'
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build and verify ZIP packages
        run: |
          python3 scripts/package.py
          cd artifacts
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: proxyflow-release-packages
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS
          if-no-files-found: error
      - name: Create preview release and publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.zip artifacts/SHA256SUMS \
            --verify-tag --draft --prerelease \
            --title "ProxyFlow $GITHUB_REF_NAME — 开发预览" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false
